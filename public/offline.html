<!-- public/offline.html -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오프라인 — 바른인증식당</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { min-height:100dvh; display:grid; place-items:center; text-align:center; padding:24px;
      font-family:'Pretendard Variable',Pretendard,sans-serif; color:#1E1310;
      background:radial-gradient(900px 500px at 80% -10%, rgba(232,84,31,.12), transparent 60%), #FAF6EF; }
    .bowl { font-size:72px; animation:float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    h1 { font-size:22px; font-weight:800; margin:18px 0 8px; }
    p { color:#6E5A52; font-size:15px; line-height:1.6; margin-bottom:26px; }
    button { background:#C63D0F; color:#fff; border:0; border-radius:14px; padding:15px 34px;
      font-size:16px; font-weight:700; cursor:pointer; transition:transform .15s; }
    button:active { transform:scale(.96); }
  </style>
</head>
<body>
  <main>
    <div class="bowl">🍲</div>
    <h1>네트워크가 끊겼어요</h1>
    <p>연결되면 다시 따뜻한 한 상을 차려드릴게요.<br />잠시 후 다시 시도해 주세요.</p>
    <button onclick="location.reload()">다시 연결하기</button>
  </main>
</body>
</html>
